function classify(title){const s=title.normalize('NFKC').toLowerCase();if(/moncler|盟可睐|蒙克莱/.test(s))return'moncler';if(/ralph\s*lauren|polo|拉夫劳伦|拉夫外套/.test(s))return'ralph';if(/stone\s*isl|stone island|石头岛/.test(s))return'stone';if(/the north face|t\s*n\s*f|tnf|北面/.test(s))return'northface';return'other'}
all.forEach(a=>a.brand=classify(a.title));
function brandName(id){const b=brands.find(x=>x.id===id)||brands.at(-1);return b[lang]}
function englishTitle(a){let s=a.title.normalize('NFKC');s=s.replace(/𝗧𝗵𝗲 𝗡𝗼𝗿𝘁𝗵 𝗙𝗮𝗰𝗲|The North Face|TNF|T\s*N\s*F|北面|Moncler|MONCLER|盟可睐|蒙克莱|Ralph Lauren|Polo|拉夫劳伦|拉夫外套|Stone Island|stone isl|Stone|石头岛/gi,' ').replace(/\s+/g,' ').trim();const entries=Object.entries(words).sort((a,b)=>b[0].length-a[0].length);for(const [zh,en] of entries)s=s.replaceAll(zh,` ${en} `);s=s.replace(/[\u3400-\u9fff]/g,' ').replace(/系列/g,' ').replace(/\s+/g,' ').replace(/\s+([,./])/g,'$1').trim();s=s.replace(/\b([a-z])/g,m=>m.toUpperCase());return s||a.title}
function titleFor(a){return lang==='zh'?a.title:`${brandName(a.brand)} · ${englishTitle(a)}`}
function brandOptions(){brandFilter.innerHTML=`<option value="all">${ui[lang].allBrands}</option>`+brands.map(b=>`<option value="${b.id}">${b[lang]}</option>`).join('')}
function renderBrandIndex(){const index=document.getElementById('brandIndex');index.setAttribute('aria-label',lang==='en'?'Browse by brand':'按品牌浏览');const number=new Intl.NumberFormat(lang==='zh'?'zh-CN':'en');index.innerHTML=brands.map(b=>`<a href="#brand-${b.id}" data-brand-jump="${b.id}">${esc(brandName(b.id))}<span>${number.format(all.filter(a=>a.brand===b.id).length)}</span></a>`).join('')}
function sortOptions(){const labels=ui[lang];sort.innerHTML=`<option value="brand">${labels.sortBrand}</option><option value="title">${labels.sortTitle}</option><option value="title-rev">${labels.sortTitleRev}</option><option value="count">${labels.sortPhotos}</option>`;sort.value='brand'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sorted(items){const a=[...items];if(sort.value==='title')a.sort((x,y)=>titleFor(x).localeCompare(titleFor(y),lang==='zh'?'zh-CN':'en',{numeric:true,sensitivity:'base'}));else if(sort.value==='title-rev')a.sort((x,y)=>titleFor(y).localeCompare(titleFor(x),lang==='zh'?'zh-CN':'en',{numeric:true,sensitivity:'base'}));else if(sort.value==='count')a.sort((x,y)=>y.count-x.count||titleFor(x).localeCompare(titleFor(y),lang));else if(sort.value==='brand')a.sort((x,y)=>brandName(x.brand).localeCompare(brandName(y.brand),lang==='zh'?'zh-CN':'en')||titleFor(x).localeCompare(titleFor(y),lang==='zh'?'zh-CN':'en',{numeric:true,sensitivity:'base'}));return a}
function imageMarkup(url,alt,cls){return `<img class="${cls}" src="${esc(url)}" loading="lazy" decoding="async" alt="${esc(alt)}">`}
function card(a){const title=titleFor(a),isWeidian=/^https?:\/\/(?:www\.)?weidian\.com(?:\/|$)/i.test(a.description||''),original=lang==='en'&&/[\u3400-\u9fff]/.test(a.title)?`<p class="original-title"><span>${ui[lang].original}:</span> ${esc(a.title)}</p>`:`<p class="original-title original-title--empty" aria-hidden="true"></p>`,productMarkup=a.description?`<a class="source-link${isWeidian?' weidian-link':''}" href="${esc(a.description)}" target="_blank" rel="noopener noreferrer">${esc(isWeidian?ui[lang].weidian:ui[lang].product)}${isWeidian?'<svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M6 14 14 6M7 6h7v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</a>`:`<span class="source-link source-link--empty" aria-hidden="true"></span>`;return `<article class="album"><a class="cover" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(title)}">${imageMarkup(a.cover||a.images[0]?.url||'',title,'cover-image')}</a><div class="album-body"><div class="title-row"><h3 class="title">${esc(title)}</h3><span class="brand-pill">${esc(brandName(a.brand))}</span></div>${original}<div class="metadata"><span>${ui[lang].photoCount(a.count)}</span><span class="dot"></span><span>ID ${esc(a.id)}</span></div>${productMarkup}<details><summary>${ui[lang].showPhotos(a.count)}</summary><div class="photos">${a.images.map((i,n)=>`<a class="photo" href="${esc(i.viewer||i.original)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(i.name)}">${imageMarkup(i.url,i.name,'photo-image')}<span>${String(n+1).padStart(2,'0')} · ${esc(i.name)}</span></a>`).join('')}</div></details></div></article>`}
function render(){const term=q.value.trim().toLocaleLowerCase(lang==='zh'?'zh-CN':'en');const selected=brandFilter.value;const matches=all.filter(a=>selected==='all'||a.brand===selected).filter(a=>!term||[a.title,titleFor(a),brandName(a.brand),a.description,...a.images.map(i=>i.name)].join(' ').toLocaleLowerCase(lang==='zh'?'zh-CN':'en').includes(term));const ordered=sorted(matches);document.getElementById('visible').textContent=ui[lang].visible(matches.length,all.length);if(!ordered.length){gallery.innerHTML=`<div class="empty">${lang==='en'?'No albums match this search.':'没有找到匹配的图册。'}</div>`;return}if(sort.value!=='brand'){gallery.innerHTML=`<div class="album-grid">${ordered.map(card).join('')}</div>`}else{const groups=brands.map(b=>({brand:b,items:ordered.filter(a=>a.brand===b.id)})).filter(g=>g.items.length);gallery.innerHTML=groups.map(g=>{const albumCount=g.items.length;const photoCount=g.items.reduce((sum,a)=>sum+a.count,0);const number=new Intl.NumberFormat(lang==='zh'?'zh-CN':'en');return `<section class="brand-section" id="brand-${g.brand.id}" data-brand="${g.brand.id}"><header class="brand-heading"><div class="brand-logo-frame">${g.brand.logo?`<img class="brand-logo" src="${esc(g.brand.logo)}" loading="lazy" decoding="async" alt="${esc(brandName(g.brand.id))} logo">`:''}</div><div class="brand-heading-copy"><h2>${esc(brandName(g.brand.id))}</h2><p>${ui[lang].products}</p></div><div class="brand-stats"><span><strong>${number.format(albumCount)}</strong><small>${ui[lang].albumsUnit}</small></span><span><strong>${number.format(photoCount)}</strong><small>${ui[lang].photosUnit}</small></span></div></header><div class="album-grid">${g.items.map(card).join('')}</div></section>`}).join('')}gallery.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(img.classList.contains('brand-logo')){img.remove();return}const box=img.closest('.cover,.photo');if(box){box.classList.add('fallback');box.replaceChildren(document.createTextNode(lang==='en'?'Photo unavailable':'照片暂不可用'))}},{once:true}))}
function setLanguage(next){lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));const labels=ui[lang];document.title=lang==='en'?'Lucky68 — The Archive':'Lucky68 — 衣橱图册';document.getElementById('archiveLabel').textContent=labels.archive;document.getElementById('intro').textContent=labels.intro;document.getElementById('totalAlbums').textContent=labels.albums(data.totalAlbums);document.getElementById('totalPhotos').textContent=labels.photos(data.totalImages);document.getElementById('footer').textContent=labels.footer;q.setAttribute('aria-label',lang==='en'?'Search albums, products and photos':'搜索图册、商品和照片');q.placeholder=lang==='en'?'Search albums, products, photos…':'搜索图册、商品和照片…';brandFilter.setAttribute('aria-label',lang==='en'?'Filter by brand':'按品牌筛选');sort.setAttribute('aria-label',lang==='en'?'Sort albums':'图册排序');brandOptions();sortOptions();renderBrandIndex();render()}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{try{localStorage.setItem('lucky68-language-choice',b.dataset.lang)}catch{}setLanguage(b.dataset.lang)}));q.addEventListener('input',render);sort.addEventListener('change',render);brandFilter.addEventListener('change',render);document.getElementById('brandIndex').addEventListener('click',event=>{const link=event.target.closest('[data-brand-jump]');if(!link)return;event.preventDefault();sort.value='brand';brandFilter.value='all';render();requestAnimationFrame(()=>document.getElementById(`brand-${link.dataset.brandJump}`)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}))});setLanguage(lang);
</script></body></html>
