<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky68</title>
</head>
<body>
  <p><a href="language-picker.html?lang=en">Choose a language to open the catalogue</a></p>
  <script>
    let saved = '';
    try { saved = localStorage.getItem('lucky68-language-choice') || (localStorage.getItem('lucky68-language') === 'zh' ? 'zh' : ''); } catch {}
    location.replace(saved ? `catalog.html?lang=${saved}` : 'language-picker.html?lang=en');
  </script>
</body>
</html>
